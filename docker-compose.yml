services:
    nginx:
        container_name: nginx_budget_cycle
        image: nginx:alpine
        ports:
            - "4041:80"
        depends_on:
            - app
            - db
        volumes:
            - .:/var/www
            - ./nginx/conf.d:/etc/nginx/conf.d
        networks:
            - app-network
    db:
        image: mysql
        container_name: mysql_budget_cycle
        ports:
            - "3308:3306"
        volumes:
            - ./mysql/data:/var/lib/mysql
            - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
        environment:
            - MYSQL_ROOT_PASSWORD=password
        networks:
            - app-network
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin_budget_cycle
        ports:
            - "3900:80"
        depends_on:
            - db
    app:
        build:
            context: .
        ports:
            - "9400:9000"  # PHP-FPM port
        volumes:
            - .:/var/www
        depends_on:
            - db
        networks:
            - app-network

    mailhog:
        container_name: mailhog_budget_cycle
        image: mailhog/mailhog
        ports:
            - "8028:8028"
            - "1028:1028"
        networks:
            - app-network

    # Runs `php artisan schedule:run` every minute so scheduled commands
    # (bootstrap/app.php's ->withSchedule(), e.g. exports:run-auto for the
    # Auto Backup feature) actually fire — there's no host cron in this dev
    # setup to do it otherwise. Same image/volume as `app`, just a different
    # command instead of php-fpm.
    scheduler:
        container_name: scheduler_budget_cycle
        build:
            context: .
        volumes:
            - .:/var/www
        depends_on:
            - db
        networks:
            - app-network
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

networks:
    app-network:
        driver: bridge

