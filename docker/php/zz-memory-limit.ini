; Default 128M is exhausted by bulk operations (Excel imports of a few
; hundred rows) once Laravel Debugbar's query collector — which retains
; every query's SQL/bindings/backtrace for the request, unconditionally,
; regardless of Debugbar::disable() being called mid-request — has
; accumulated enough data. Raised here at the php-fpm pool level because
; a controller-level ini_set() call happens too late to affect it.
memory_limit = 512M
